<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Pranav Thukral. Computer Science and BBA, University of Waterloo.">
  <style>
    .bg   { fill: #ffffff; }
    .ink  { fill: #000000; }
    .mute { fill: #6e6e73; }
    .line { stroke: #000000; }
    .hair { stroke: #d2d2d7; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #000000; }
      .ink  { fill: #f5f5f7; }
      .mute { fill: #86868b; }
      .line { stroke: #f5f5f7; }
      .hair { stroke: #333336; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect class="bg" width="1200" height="280"/>

  <line class="line" x1="0" y1="0.5" x2="1200" y2="0.5" stroke-width="1"/>

  <text class="ink" x="0" y="140" font-size="72" font-weight="600" letter-spacing="-2">Pranav Thukral</text>
  <text class="mute" x="2" y="190" font-size="26" font-weight="400" letter-spacing="-0.2">Computer Science &amp; BBA · University of Waterloo</text>

  <line class="hair" x1="0" y1="239.5" x2="1200" y2="239.5" stroke-width="1"/>
  <text class="mute" x="2" y="268" font-size="15" font-weight="500" letter-spacing="2">SOFTWARE · PRODUCT · BUSINESS</text>
  <text class="mute" x="1198" y="268" font-size="15" font-weight="500" letter-spacing="2" text-anchor="end">TORONTO / WATERLOO</text>
</svg>
